<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Benefícios & Planos — Gestão COMPEX</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div id="admin-shell" data-active="beneficios-gestao"></div>
<main class="shell-main">
  <header class="shell-topbar">
    <div><p class="eyebrow">Benefícios & Planos</p><h1>Gestão de Vantagens & Associação</h1><p>Cadastro de empresas parceiras, descontos e modalidades de planos do sócio.</p></div>
    <div style="display:flex;gap:10px">
      <button id="btn-top-action" class="btn btn-primary">+ Novo benefício</button>
    </div>
  </header>

  <!-- Navegação por Abas (Exatamente idêntica à tela de produtos.html) -->
  <div class="tabs-bar" style="display:flex;gap:12px;border-bottom:2px solid #e2e8f0;margin-bottom:20px">
    <button type="button" id="tab-btn-benefits" class="tab-btn active" style="padding:10px 18px;border:none;background:none;font-weight:700;font-size:14px;border-bottom:3px solid #2b6cb0;color:#2b6cb0;cursor:pointer">✦ Parceiros & Benefícios</button>
    <button type="button" id="tab-btn-plans" class="tab-btn" style="padding:10px 18px;border:none;background:none;font-weight:700;font-size:14px;color:#718096;cursor:pointer">☆ Planos do Sócio</button>
  </div>

  <!-- ABA 1: PARCEIROS & BENEFÍCIOS -->
  <div id="tab-content-benefits">
    <section class="grid grid-2" style="margin-bottom:18px">
      <article class="metric-card"><p>Total de Benefícios</p><strong id="metric-total">--</strong></article>
      <article class="metric-card"><p>Alimentação & Gastronomia</p><strong id="metric-food">--</strong></article>
    </section>

    <section class="card">
      <div class="toolbar"><input type="search" id="search" placeholder="Buscar por parceiro ou categoria…"></div>
      <div id="list"></div>
    </section>
  </div>

  <!-- ABA 2: PLANOS DO SÓCIO -->
  <div id="tab-content-plans" style="display:none">
    <section class="grid grid-2" style="margin-bottom:18px">
      <article class="metric-card"><p>Total de Planos</p><strong id="metric-plans-total">--</strong></article>
      <article class="metric-card"><p>Planos Ativos</p><strong id="metric-plans-active">--</strong></article>
    </section>

    <section class="card">
      <div class="toolbar"><input type="search" id="search-plans" placeholder="Buscar plano por nome…"></div>
      <div id="plans-list"></div>
    </section>
  </div>
</main>

<!-- MODAL: BENEFÍCIO -->
<div class="modal-backdrop" id="modal">
  <form class="modal" id="form">
    <h2 id="modal-title">Novo benefício</h2>
    <input type="hidden" id="benefit-id">
    <div class="field"><label>Nome do parceiro / estabelecimento</label><input id="name" required placeholder="Ex: Café Byte"></div>
    <div class="field-row">
      <div class="field">
        <label>Categoria</label>
        <select id="category" required>
          <option value="Alimentação">Alimentação</option>
          <option value="Esporte">Esporte</option>
          <option value="Serviços">Serviços</option>
          <option value="Lazer">Lazer</option>
          <option value="Saúde">Saúde</option>
        </select>
      </div>
      <div class="field"><label>Ícone (Emoji)</label><input id="icon" required value="☕"></div>
    </div>
    <div class="field"><label>Desconto / Vantagem</label><input id="discount" required placeholder="Ex: 10% OFF"></div>
    <div class="field"><label>Descrição / Regras</label><textarea id="description" rows="2" placeholder="Ex: Apresentar carteirinha digital válida"></textarea></div>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" id="close">Cancelar</button>
      <button class="btn btn-primary" type="submit">Salvar Benefício</button>
    </div>
  </form>
</div>

<!-- MODAL: PLANO DO SÓCIO -->
<div class="modal-backdrop" id="plan-modal">
  <form class="modal" id="plan-form">
    <h2 id="plan-modal-title">Novo plano do sócio</h2>
    <input type="hidden" id="plan-id">
    <div class="field"><label>Nome do plano</label><input id="plan-name" required placeholder="Ex: Plano Anual"></div>
    <div class="field-row">
      <div class="field"><label>Preço (R$)</label><input id="plan-price" required placeholder="49.90"></div>
      <div class="field"><label>Recorrência</label><input id="plan-period" required placeholder="/ano"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Vagas de esporte inclusas</label><input id="plan-slots" type="number" min="0" value="1" required></div>
      <div class="field"><label>Ícone (Emoji)</label><input id="plan-icon" required value="☆"></div>
    </div>
    <div class="field"><label>Descrição das vantagens</label><textarea id="plan-description" rows="2" placeholder="Detalhes das vantagens do plano..."></textarea></div>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" id="plan-close">Cancelar</button>
      <button class="btn btn-primary" type="submit">Salvar Plano</button>
    </div>
  </form>
</div>

<script src="beneficios-gestao.js"></script>
</body>
</html>
