<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Permissões — Gestão COMPEX</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div id="admin-shell" data-active="permissions"></div>
<main class="shell-main">
  <header class="shell-topbar">
    <div><p class="eyebrow">Sistema</p><h1>Permissões</h1><p>Papéis e acessos da diretoria.</p></div>
    <button id="new-director" class="btn btn-primary">+ Nova conta</button>
  </header>

  <section class="card">
    <div class="panel-head"><h2>Contas</h2><span class="muted" id="count-label"></span></div>
    <div id="directors-list"></div>
  </section>
</main>

<dialog id="modal">
  <form id="director-form" class="modal" style="width:min(92vw,440px)">
    <h2 id="director-modal-title">Nova conta</h2>
    <div class="field"><label>Nome</label><input id="d-name" required></div>
    <div class="field"><label>E-mail</label><input id="d-email" type="email" required></div>
    <div class="field"><label>Senha</label><input id="d-password" type="password" required minlength="8"></div>
    <div class="field"><label>Data de nascimento</label><input id="d-birthdate" type="date"></div>
    <div class="field" id="d-role-field"><label>Área</label>
      <select id="d-role"><option value="PRESIDENCIA">Presidência</option><option value="FINANCEIRO">Financeiro</option><option value="ESPORTES">Esportes</option><option value="EVENTOS">Eventos</option><option value="MARKETING">Marketing</option><option value="PRODUTOS">Produtos</option><option value="PATRIMONIO">Patrimônio</option></select>
    </div>
    <div class="field" id="d-rank-field"><label>Nível</label>
      <select id="d-rank"><option value="COORDENADOR">Coordenador</option><option value="DIRETOR">Diretor</option></select>
    </div>
    <p class="modal-sub">Para virar sócio da atlética, o próprio diretor/coordenador preenche e paga a mensalidade depois de entrar pela primeira vez.</p>
    <p id="d-error" class="modal-error"></p>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" id="d-cancel">Cancelar</button>
      <button class="btn btn-primary" type="submit">Criar conta</button>
    </div>
  </form>
</dialog>

<dialog id="edit-modal">
  <form id="edit-form" class="modal" style="width:min(92vw,420px)">
    <h2>Editar conta</h2>
    <input type="hidden" id="e-id">
    <div class="field"><label>Nome</label><input id="e-name" required></div>
    <div class="field"><label>E-mail</label><input id="e-email" type="email" required></div>
    <p id="e-error" class="modal-error"></p>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" id="e-cancel">Cancelar</button>
      <button class="btn btn-primary" type="submit">Salvar</button>
    </div>
  </form>
</dialog>
<script src="/gestao/permissions.js"></script>
</body>
</html>
