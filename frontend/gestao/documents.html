<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Documentos — Gestão COMPEX</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div id="admin-shell" data-active="documents"></div>
<main class="shell-main">
  <header class="shell-topbar">
    <div><p class="eyebrow">Transparência</p><h1>Documentos</h1><p>Atas, prestações de contas e arquivos da gestão.</p></div>
    <button id="upload" class="btn btn-primary">+ Enviar documento</button>
  </header>

  <section class="card" style="margin-bottom:18px">
    <div class="panel-head"><h2>Arquivos (<span id="all-count">00</span>)</h2></div>
    <div class="toolbar"><input type="search" id="search" placeholder="Buscar por nome ou categoria…"></div>
    <div id="list"></div>
  </section>

  <section class="card">
    <div class="panel-head"><h2>Enquetes internas</h2><button id="new-poll" class="btn btn-ghost btn-sm">+ Nova enquete</button></div>
    <div id="polls-list"></div>
  </section>
</main>

<div class="modal-backdrop" id="modal">
  <form class="modal" id="form">
    <h2>Enviar documento</h2>
    <div class="field"><label>Nome</label><input id="name" required></div>
    <div class="field-row">
      <div class="field"><label>Categoria</label><input id="category" required></div>
      <div class="field"><label>Acesso</label>
        <select id="access"><option value="public">Público</option><option value="private">Diretoria</option></select>
      </div>
    </div>
    <div class="field"><label>Arquivo</label><input id="file" type="file"></div>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" id="close">Cancelar</button>
      <button class="btn btn-primary" type="submit">Enviar</button>
    </div>
  </form>
</div>

<dialog id="poll-modal">
  <form id="poll-form" class="modal" style="width:min(92vw,480px)">
    <h2>Nova enquete</h2>
    <div class="field">
      <label>Pergunta ou Enunciado</label>
      <input id="poll-question" placeholder="Ex: Qual deve ser o próximo evento da Atlética?" required>
    </div>
    
    <div class="field">
      <label>Opções de Votação</label>
      <div id="poll-options-container" style="display:flex;flex-direction:column;gap:8px;margin-bottom:8px;">
        <!-- Dynamic option fields will be rendered here -->
      </div>
      <button type="button" id="add-option-btn" class="btn btn-ghost btn-sm" style="align-self:flex-start;">+ Adicionar opção</button>
    </div>

    <div class="field-row" style="margin-top:12px;">
      <div class="field">
        <label>Prazo de Validade / Encerramento</label>
        <select id="poll-duration">
          <option value="none">Sem prazo (encerrar manualmente)</option>
          <option value="24h" selected>24 horas</option>
          <option value="3d">3 dias</option>
          <option value="7d">7 dias</option>
          <option value="custom">Data e Hora personalizada...</option>
        </select>
      </div>
    </div>

    <div class="field" id="custom-date-field" style="display:none;margin-top:8px;">
      <label>Data e Hora de Encerramento</label>
      <input type="datetime-local" id="poll-custom-date">
    </div>

    <p id="poll-error" class="modal-error" style="color:var(--danger, #c35d4b);font-size:12px;margin-top:8px;"></p>
    <div class="modal-actions">
      <button type="button" id="poll-cancel" class="btn btn-ghost">Cancelar</button>
      <button class="btn btn-primary" type="submit">Criar enquete</button>
    </div>
  </form>
</dialog>
<script src="/gestao/documents.js"></script>
</body>
</html>
