<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Check-in — Gestão COMPEX</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div id="admin-shell" data-active="checkin"></div>
<main class="shell-main">
  <header class="shell-topbar">
    <div><p class="eyebrow">Eventos</p><h1>Check-in</h1><p>Valide a entrada dos associados por QR code ou código manual.</p></div>
  </header>

  <span class="live">● Carregando…</span>
  <section class="grid grid-2" style="align-items:start;margin-bottom:18px">
    <article class="card">
      <div class="event-info"><h2>Sem evento ativo</h2><p>Carregando informações do evento…</p></div>
      <div class="camera-box">
        <video id="video" playsinline muted></video>
        <div id="camera-placeholder">Aponte a câmera para o QR code do associado.</div>
      </div>
      <canvas id="scan-canvas" style="display:none"></canvas>
      <div class="camera-actions">
        <button id="start-camera" class="btn btn-primary btn-sm">Ligar câmera</button>
        <button id="stop-camera" class="btn btn-ghost btn-sm">Desligar</button>
        <span id="camera-status">Câmera pronta</span>
      </div>
      <div class="code-entry">
        <input id="code" placeholder="Ou digite o código manualmente">
        <button id="validate" class="btn btn-primary">Validar</button>
      </div>
      <div class="scan-result" id="result"></div>
    </article>

    <article class="card">
      <div class="panel-head"><h2>Totais</h2></div>
      <div class="grid grid-3">
        <div><p class="eyebrow">Total</p><strong id="total" style="font-size:22px">--</strong></div>
        <div><p class="eyebrow">Confirmados</p><strong id="confirmed" style="font-size:22px">--</strong></div>
        <div><p class="eyebrow">Aguardando</p><strong id="waiting" style="font-size:22px">--</strong></div>
      </div>
      <hr class="hairline">
      <p class="eyebrow">Check-ins recentes</p>
      <div id="recent-list"></div>
    </article>
  </section>
</main>
<script src="/shared/jsqr.js"></script>
<script src="/gestao/checkin.js"></script>
</body>
</html>
