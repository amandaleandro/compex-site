<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Financeiro — Gestão COMPEX</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div id="admin-shell" data-active="finance"></div>
<main class="shell-main">
  <header class="shell-topbar">
    <div><p class="eyebrow">Financeiro</p><h1>Fluxo de caixa</h1><p>Movimentações de receitas e despesas da atlética.</p></div>
    <button id="new" class="btn btn-primary">+ Nova movimentação</button>
  </header>

  <section class="grid grid-3" style="margin-bottom:18px">
    <article class="metric-card"><p>Saldo</p><strong id="balance">--</strong></article>
    <article class="metric-card"><p>Receitas</p><strong id="income" style="color:var(--success)">--</strong></article>
    <article class="metric-card"><p>Despesas</p><strong id="expense" style="color:var(--danger)">--</strong></article>
  </section>

  <section class="card" style="margin-bottom:18px">
    <div class="panel-head"><h2>Receitas x despesas</h2><select id="filter-months" class="btn btn-ghost btn-sm" style="width:auto"><option value="3">Últimos 3 meses</option><option value="6" selected>Últimos 6 meses</option><option value="12">Últimos 12 meses</option></select></div>
    <div class="chart-legend"><span><i class="income"></i>Receitas</span><span><i class="expense"></i>Despesas</span></div>
    <div class="chart">
      <div class="y-axis" id="chart-y-axis"></div>
      <div class="chart-area">
        <div class="grid-lines"></div>
        <svg viewBox="0 0 600 220" preserveAspectRatio="none">
          <path class="area-income" id="chart-area-income"/>
          <path class="line-income" id="chart-line-income"/>
          <path class="line-expense" id="chart-line-expense"/>
        </svg>
        <div class="x-axis" id="chart-x-axis"></div>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="toolbar">
      <p class="muted" style="margin:0">Resultado do período: <strong id="result">--</strong></p>
      <span class="spacer"></span>
      <select id="source-filter">
        <option value="all">Manuais + automáticas</option>
        <option value="manual">Só manuais</option>
        <option value="auto">Só automáticas</option>
      </select>
      <select id="filter">
        <option value="all">Todas</option>
        <option value="income">Receitas</option>
        <option value="expense">Despesas</option>
      </select>
    </div>
    <div id="list"></div>
  </section>
</main>

<div class="modal-backdrop" id="modal">
  <form class="modal">
    <h2 id="modal-title">Nova movimentação</h2>
    <input type="hidden" id="transaction-id">
    <div class="type-toggle">
      <button type="button" class="active" data-type="income">↑ Receita</button>
      <button type="button" data-type="expense">↓ Despesa</button>
    </div>
    <div class="field"><label>Descrição</label><input id="description" required></div>
    <div class="field-row">
      <div class="field"><label>Valor (R$)</label><input id="amount" type="number" step="0.01" min="0" required></div>
      <div class="field"><label>Categoria</label><input id="category" required></div>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" id="close">Cancelar</button>
      <button class="btn btn-primary" type="submit" id="transaction-submit">Salvar</button>
    </div>
  </form>
</div>
<script src="/gestao/finance.js"></script>
</body>
</html>
