<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tornar-se sócio — Gestão COMPEX</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div id="admin-shell" data-active=""></div>
<main class="shell-main" style="max-width:640px">
  <header class="shell-topbar">
    <div><p class="eyebrow">Diretoria</p><h1>Tornar-se sócio da atlética</h1><p>Olá, <em data-user-name>diretor(a)</em> — preencha seus dados e finalize o pagamento para virar associado(a) da COMPEX.</p></div>
  </header>

  <section class="card" id="already-member" hidden>
    <h2 style="margin-top:0">Você já é sócio</h2>
    <p class="muted">Situação da sua mensalidade: <strong id="member-status"></strong></p>
    <a href="mensalidade.html" id="go-pay" class="btn btn-primary" hidden>Ir para pagamento</a>
  </section>

  <form class="card" id="become-form">
    <div class="field"><label>Curso</label><input id="course" required></div>
    <div class="field-row">
      <div class="field"><label>Plano</label><select id="plan"><option value="Anual">Anual</option><option value="Semestral">Semestral</option></select></div>
      <div class="field"><label>Sexo</label><select id="sex"><option value="">Não informar</option><option value="Feminino">Feminino</option><option value="Masculino">Masculino</option><option value="Outro">Outro</option></select></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Nome social (opcional)</label><input id="social-name"></div>
      <div class="field"><label>Apelido (opcional)</label><input id="nickname"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Tamanho de camiseta</label><select id="shirt-size"><option value="">--</option><option>PP</option><option>P</option><option>M</option><option>G</option><option>GG</option><option>XG</option></select></div>
      <div class="field"><label>Instagram (opcional)</label><input id="instagram" placeholder="@usuario"></div>
    </div>
    <p id="error" class="modal-error"></p>
    <button class="btn btn-primary" type="submit" style="width:100%">Cadastrar e ir para pagamento</button>
  </form>
</main>
<script src="associar-se.js"></script>
</body>
</html>
